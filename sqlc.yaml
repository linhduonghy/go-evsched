version: "2"

sql:
  - engine: "postgresql"

    schema: "db/sql/schema"

    queries: "db/sql/query"

    gen:
      go:
        package: "sqlc"

        out: "db/sqlc"

        sql_package: "pgx/v5"

        emit_json_tags: true

        emit_interface: true

        emit_empty_slices: true

        emit_exact_table_names: false

        overrides:
          - db_type: "job_schedule_type"
            go_type:
              import: "evsched/db"
              type: "JobScheduleType"
          - db_type: "job_state"
            go_type:
              import: "evsched/db"
              type: "JobState"
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
